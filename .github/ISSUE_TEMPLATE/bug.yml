name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove secrets and private repository content before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, sanitized README excerpt, expected result, actual result, and exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
