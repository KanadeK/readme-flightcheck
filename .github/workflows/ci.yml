name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:coverage
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: ignore
          name: verification-artifacts
          path: |
            coverage/
            media/
            playwright-report/
            test-results/
